  <rect x="130" y="210" width="18" height="14" fill="#FFB703"/>
  <rect x="152" y="210" width="18" height="14" fill="#A8DADC"/>
  <rect x="174" y="210" width="18" height="14" fill="#E63946"/>
  <rect x="196" y="210" width="18" height="14" fill="#FFB703"/>
  <rect x="218" y="210" width="18" height="14" fill="#A8DADC"/>
  <rect x="240" y="210" width="18" height="14" fill="#E63946"/>
  <rect x="262" y="210" width="18" height="14" fill="#FFB703"/>
  <rect x="284" y="210" width="18" height="14" fill="#A8DADC"/>
  <rect x="306" y="210" width="18" height="14" fill="#E63946"/>
  <rect x="328" y="210" width="18" height="14" fill="#FFB703"/>
  <rect x="350" y="210" width="18" height="14" fill="#A8DADC"/>
  <rect x="372" y="210" width="18" height="14" fill="#E63946"/>

  <!-- Elemento decorativo superior Memphis: columna asimétrica -->
  <rect x="320" y="145" width="25" height="65" fill="#457B9D" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="315" y="130" width="35" height="20" fill="#FFB703" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="332" cy="122" r="12" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>

