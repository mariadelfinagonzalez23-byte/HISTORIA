  <text x="620" y="108" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Vista Lateral / Perspectiva</text>

  <!-- Perspectiva isométrica simplificada -->
  <!-- Cara lateral derecha -->
  <polygon points="520,220 580,190 580,535 520,535" fill="#7DC8C8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Cara superior perspectiva -->
  <polygon points="520,220 640,220 700,190 580,190" fill="#D0EAE8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Cara frontal perspectiva -->
  <!-- Cuerpo -->
  <rect x="640" y="220" width="200" height="315" fill="#F1FAEE" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Panel lateral izq perspectiva -->
  <rect x="620" y="220" width="20" height="315" fill="#457B9D" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Panel lateral der perspectiva -->
  <rect x="840" y="220" width="20" height="315" fill="#457B9D" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Cajón superior perspectiva -->
  <rect x="640" y="220" width="200" height="65" fill="#FFB703" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="640" y1="285" x2="840" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="740" cy="252" r="9" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="740" cy="252" r="4" fill="#1a1a1a"/>

  <!-- Puerta izquierda perspectiva -->
  <rect x="640" y="285" width="97" height="250" fill="#A8DADC" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="666" cy="315" r="5" fill="#E63946" opacity="0.8"/>
  <circle cx="700" cy="315" r="5" fill="#1a1a1a" opacity="0.8"/>
  <circle cx="666" cy="345" r="5" fill="#1a1a1a" opacity="0.8"/>
  <circle cx="700" cy="345" r="5" fill="#E63946" opacity="0.8"/>
  <circle cx="666" cy="375" r="5" fill="#E63946" opacity="0.8"/>
  <circle cx="700" cy="375" r="5" fill="#1a1a1a" opacity="0.8"/>
  <polygon points="655,410 670,390 685,410" fill="#FFB703" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- 3 cajones derechos perspectiva -->
  <rect x="737" y="285" width="103" height="83" fill="#F1FAEE" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="788" cy="326" r="8" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="737" y="368" width="103" height="83" fill="#FFB703" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="788" cy="409" r="8" fill="#1a1a1a" stroke="#FFB703" stroke-width="2"/>
  <rect x="737" y="451" width="103" height="84" fill="#A8DADC" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="788" cy="493" r="8" fill="#F1FAEE" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Cubierta superior perspectiva -->
  <rect x="620" y="208" width="240" height="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Rayas decorativas cubierta -->
  <rect x="628" y="210" width="16" height="14" fill="#E63946"/>
  <rect x="648" y="210" width="16" height="14" fill="#FFB703"/>
  <rect x="668" y="210" width="16" height="14" fill="#A8DADC"/>
  <rect x="688" y="210" width="16" height="14" fill="#E63946"/>
  <rect x="708" y="210" width="16" height="14" fill="#FFB703"/>
  <rect x="728" y="210" width="16" height="14" fill="#A8DADC"/>
  <rect x="748" y="210" width="16" height="14" fill="#E63946"/>
  <rect x="768" y="210" width="16" height="14" fill="#FFB703"/>
  <rect x="788" y="210" width="16" height="14" fill="#A8DADC"/>
  <rect x="808" y="210" width="16" height="14" fill="#E63946"/>
  <rect x="828" y="210" width="16" height="14" fill="#FFB703"/>

  <!-- Patas perspectiva -->
  <rect x="635" y="530" width="18" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="660" y="530" width="18" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>
  <rect x="822" y="530" width="18" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="847" y="530" width="18" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>

  <!-- Elemento decorativo columna perspectiva -->
