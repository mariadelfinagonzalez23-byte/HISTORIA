<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Georgia, serif">

  <!-- Fondo -->
  <rect width="900" height="700" fill="#FAFAF5"/>

  <!-- Título -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">CROQUIS — APARADOR MEMPHIS</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#444">Inspirado en el Grupo Memphis (1981) · Ettore Sottsass</text>
  <text x="450" y="76" text-anchor="middle" font-size="11" fill="#666">Historia del Arte · Tecnicatura en Diseño de Interiores · ABM</text>

  <!-- ============================================================ -->
  <!-- VISTA FRONTAL -->
  <!-- ============================================================ -->
  <text x="225" y="108" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Vista Frontal</text>

  <!-- Patas izquierda - forma Memphis: cilindros con color -->
  <!-- Pata delantera izq -->
  <rect x="115" y="530" width="20" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Pata trasera izq -->
  <rect x="145" y="530" width="20" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>

  <!-- Patas derechas -->
  <rect x="315" y="530" width="20" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="285" y="530" width="20" height="80" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>

  <!-- Cuerpo principal del aparador -->
  <!-- Panel lateral izquierdo -->
  <rect x="110" y="220" width="30" height="315" fill="#457B9D" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Panel lateral derecho -->
  <rect x="380" y="220" width="30" height="315" fill="#457B9D" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Panel trasero (profundidad) -->
