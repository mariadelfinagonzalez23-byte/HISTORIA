  <line x1="255" y1="389" x2="380" y2="389" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
  <line x1="255" y1="410" x2="380" y2="410" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
  <line x1="255" y1="431" x2="380" y2="431" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
  <line x1="276" y1="368" x2="276" y2="451" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
  <line x1="297" y1="368" x2="297" y2="451" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
