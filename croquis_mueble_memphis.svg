  <line x1="155" y1="220" x2="180" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="220" x2="195" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="185" y1="220" x2="210" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="220" x2="225" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="215" y1="220" x2="240" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="230" y1="220" x2="255" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="245" y1="220" x2="270" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="260" y1="220" x2="285" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="275" y1="220" x2="300" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="220" x2="315" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="305" y1="220" x2="330" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="320" y1="220" x2="345" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="335" y1="220" x2="360" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <line x1="350" y1="220" x2="375" y2="285" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
