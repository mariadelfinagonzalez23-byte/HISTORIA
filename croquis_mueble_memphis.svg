  <rect x="795" y="130" width="32" height="20" fill="#FFB703" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="811" cy="122" r="11" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Línea suelo perspectiva -->
  <line x1="510" y1="610" x2="870" y2="610" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ============================================================ -->
  <!-- ACOTACIONES VISTA FRONTAL -->
  <!-- ============================================================ -->
  <!-- Flecha ancho total -->
  <line x1="100" y1="625" x2="410" y2="625" stroke="#333" stroke-width="1.2"/>
  <polygon points="100,621 100,629 90,625" fill="#333"/>
  <polygon points="410,621 410,629 420,625" fill="#333"/>
  <text x="255" y="642" text-anchor="middle" font-size="11" fill="#333">1200 mm</text>

  <!-- Flecha altura total -->
  <line x1="68" y1="208" x2="68" y2="610" stroke="#333" stroke-width="1.2"/>
  <polygon points="64,208 72,208 68,198" fill="#333"/>
  <polygon points="64,610 72,610 68,620" fill="#333"/>
  <text x="56" y="415" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90, 56, 415)">900 mm</text>

  <!-- Flecha profundidad (perspectiva) -->
  <line x1="520" y1="625" x2="580" y2="598" stroke="#333" stroke-width="1.2"/>
  <polygon points="518,620 522,628 512,625" fill="#333"/>
  <polygon points="578,594 582,602 588,598" fill="#333"/>
  <text x="535" y="645" text-anchor="middle" font-size="11" fill="#333">450 mm</text>

  <!-- ============================================================ -->
  <!-- REFERENCIAS / LEYENDA -->
  <!-- ============================================================ -->
  <rect x="30" y="648" width="840" height="42" fill="#F0F0E8" stroke="#ccc" stroke-width="1"/>

  <rect x="40" y="658" width="16" height="16" fill="#E63946" stroke="#1a1a1a" stroke-width="1"/>
  <text x="60" y="670" font-size="10" fill="#333">Rojo (patas + tiradores)</text>

  <rect x="175" y="658" width="16" height="16" fill="#FFB703" stroke="#1a1a1a" stroke-width="1"/>
  <text x="195" y="670" font-size="10" fill="#333">Amarillo (cajón superior)</text>

  <rect x="325" y="658" width="16" height="16" fill="#A8DADC" stroke="#1a1a1a" stroke-width="1"/>
  <text x="345" y="670" font-size="10" fill="#333">Turquesa (puertas)</text>

  <rect x="450" y="658" width="16" height="16" fill="#457B9D" stroke="#1a1a1a" stroke-width="1"/>
  <text x="470" y="670" font-size="10" fill="#333">Azul (laterales)</text>

  <rect x="560" y="658" width="16" height="16" fill="#1a1a1a"/>
  <text x="580" y="670" font-size="10" fill="#333">Negro (cubierta)</text>

  <text x="670" y="666" font-size="10" fill="#555">Patrones: zigzag · puntos · cuadrícula · rayas</text>
  <text x="670" y="679" font-size="10" fill="#555">Material: MDF lacado + laminado plástico</text>

  <!-- Firma -->
  <text x="870" y="695" text-anchor="end" font-size="10" fill="#999" font-style="italic">María Delfina González · 2025</text>

</svg>
