  <!-- Cajón 3 -->
  <rect x="255" y="451" width="125" height="84" fill="#A8DADC" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="465" x2="375" y2="480" stroke="#E63946" stroke-width="2"/>
  <line x1="260" y1="480" x2="375" y2="465" stroke="#E63946" stroke-width="2"/>
  <line x1="260" y1="490" x2="375" y2="505" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="260" y1="505" x2="375" y2="490" stroke="#1a1a1a" stroke-width="1"/>
