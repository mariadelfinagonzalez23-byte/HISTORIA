  <!-- Cajón 1 -->
  <rect x="255" y="285" width="125" height="83" fill="#F1FAEE" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Patrón zigzag -->
  <polyline points="260,295 275,315 290,295 305,315 320,295 335,315 350,295 365,315 375,308" fill="none" stroke="#457B9D" stroke-width="2"/>
  <circle cx="312" cy="326" r="8" fill="#E63946" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="312" cy="326" r="3" fill="white"/>

  <!-- Cajón 2 -->
  <rect x="255" y="368" width="125" height="83" fill="#FFB703" stroke="#1a1a1a" stroke-width="1.5"/>
