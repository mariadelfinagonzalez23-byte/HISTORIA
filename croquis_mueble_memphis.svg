  <circle cx="198" cy="315" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="228" cy="315" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="168" cy="345" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="198" cy="345" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="228" cy="345" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="168" cy="375" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="198" cy="375" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="228" cy="375" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="168" cy="405" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="198" cy="405" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="228" cy="405" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="168" cy="435" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="198" cy="435" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="228" cy="435" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="168" cy="465" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="198" cy="465" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="228" cy="465" r="5" fill="#1a1a1a" opacity="0.7"/>
  <circle cx="168" cy="495" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="198" cy="495" r="5" fill="#E63946" opacity="0.7"/>
  <circle cx="228" cy="495" r="5" fill="#E63946" opacity="0.7"/>
