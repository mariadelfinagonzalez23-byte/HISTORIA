    <path d="M 490 70 Q 499 62 508 70" stroke-width="1"/>
    <path d="M 489 75 Q 499 67 509 75" stroke-width="1"/>
    <line x1="499" y1="58" x2="499" y2="49" stroke-width="1.8"/>
    <ellipse cx="499" cy="47" rx="5" ry="4" stroke-width="1.5"/>

    <!-- panel respaldo lateral (se ve el grosor) -->
    <rect x="508" y="98" width="12" height="80" rx="2" stroke-width="1.5"/>
    <!-- cornisa lateral -->
    <rect x="488" y="88" width="32" height="12" rx="2" stroke-width="1.5"/>

    <!-- línea suelo lateral -->
    <line x1="440" y1="458" x2="570" y2="458" stroke-width="0.8" stroke-dasharray="5,4" stroke="#bbb"/>

    <!-- ======================================= -->
    <!-- NOTAS                                   -->
    <!-- ======================================= -->
    <line x1="352" y1="42"  x2="114" y2="68"  stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="38"  font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">piña tallada</text>
    <text x="355" y="50"  font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">(pináculo)</text>

    <line x1="352" y1="84"  x2="292" y2="88"  stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="88"  font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">gallones</text>

    <line x1="352" y1="138" x2="270" y2="138" stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="135" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">panel tallado:</text>
    <text x="355" y="147" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">hojas de acanto + figura</text>

    <line x1="352" y1="252" x2="300" y2="260" stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="256" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">brazo en voluta</text>

    <line x1="352" y1="336" x2="312" y2="336" stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="340" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">asiento en cuero</text>

    <line x1="352" y1="383" x2="285" y2="383" stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="379" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">patas en X</text>
    <text x="355" y="391" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">(sella curulis romana)</text>

    <line x1="352" y1="450" x2="318" y2="450" stroke-width="0.7" stroke="#ccc" stroke-dasharray="3,3"/>
    <text x="355" y="454" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">base con gallones</text>

    <!-- ======================================= -->
    <!-- COTAS                                   -->
    <!-- ======================================= -->
    <!-- Ancho -->
