    <line x1="88"  y1="334" x2="88"  y2="339" stroke-width="0.8" stroke="#888"/>
    <line x1="108" y1="333" x2="108" y2="339" stroke-width="0.8" stroke="#888"/>
    <line x1="128" y1="333" x2="128" y2="339" stroke-width="0.8" stroke="#888"/>
    <line x1="148" y1="332" x2="148" y2="339" stroke-width="0.8" stroke="#888"/>
    <line x1="168" y1="332" x2="168" y2="339" stroke-width="0.8" stroke="#888"/>
