    <path d="M 258 130 Q 252 118 242 124 Q 248 136 258 130" stroke-width="1.2"/>
    <path d="M 260 142 Q 256 128 244 132 Q 248 148 260 142" stroke-width="1.2"/>
    <path d="M 258 154 Q 250 142 240 148 Q 244 162 258 154" stroke-width="1.2"/>
    <path d="M 255 118 Q 246 108 238 114" stroke-width="1"/>

