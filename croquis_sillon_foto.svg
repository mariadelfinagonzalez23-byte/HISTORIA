    <path d="M 237 443 Q 243 436 249 443 Q 255 436 261 443 Q 267 436 273 443 Q 279 436 285 443 Q 291 436 297 443 Q 303 436 309 443 Q 313 436 315 443" stroke-width="1.2"/>

