    <text x="190" y="494" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555" stroke="none">65 cm</text>

    <!-- Alto total -->
    <line x1="32" y1="34" x2="32" y2="458" stroke-width="1" stroke="#666"/>
    <line x1="27" y1="34"  x2="37" y2="34"  stroke-width="1" stroke="#666"/>
    <line x1="27" y1="458" x2="37" y2="458" stroke-width="1" stroke="#666"/>
    <text x="18" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555" stroke="none" transform="rotate(-90,18,250)">125 cm</text>

    <!-- Alto asiento -->
    <line x1="50" y1="335" x2="50" y2="458" stroke-width="0.8" stroke="#aaa" stroke-dasharray="3,3"/>
    <line x1="45" y1="335" x2="55" y2="335" stroke-width="0.8" stroke="#aaa"/>
    <line x1="45" y1="458" x2="55" y2="458" stroke-width="0.8" stroke="#aaa"/>
    <text x="38" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#999" stroke="none" transform="rotate(-90,38,400)">45 cm</text>

  </g>

  <text x="350" y="524" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#aaa" font-style="italic">Características: patas en X (curul) · piñas talladas · panel con hojas de acanto y figura · brazos en voluta · gallones · madera de nogal</text>
  <text x="350" y="538" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#aaa" font-style="italic">Movimiento: Renacimiento italiano · S. XV–XVI · recuperación de la sella curulis romana · símbolo de autoridad eclesiástica y civil</text>
  <text x="680" y="560" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#ccc" font-style="italic">referencia para dibujo a mano · M.D.G. 2025</text>

</svg>
