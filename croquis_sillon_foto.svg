    <line x1="467" y1="335" x2="527" y2="335" stroke-width="2.5"/>

    <!-- brazo lateral -->
    <path d="M 490 335 Q 476 308 470 282 Q 464 256 478 240 Q 494 226 508 238 Q 518 250 510 264 Q 502 276 490 270" stroke-width="2.2"/>

