    <path d="M 95 335 Q 105 385 118 445" stroke-width="3"/>
    <path d="M 112 335 Q 122 385 135 445" stroke-width="2"/>
    <!-- nudo X izq -->
    <circle cx="103" cy="383" r="8" stroke-width="2"/>
    <circle cx="103" cy="383" r="3" stroke-width="1.5"/>
    <!-- base izq (gallones) -->
    <rect x="62" y="443" width="80" height="14" rx="2" stroke-width="2"/>
    <path d="M 64 443 Q 70 436 76 443 Q 82 436 88 443 Q 94 436 100 443 Q 106 436 112 443 Q 118 436 124 443 Q 130 436 136 443 Q 140 436 142 443" stroke-width="1.2"/>

