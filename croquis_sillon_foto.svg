    <line x1="104" y1="40" x2="100" y2="34" stroke-width="1.2"/>

    <!-- piña der -->
    <ellipse cx="280" cy="68" rx="13" ry="12" stroke-width="2"/>
    <path d="M 269 70 Q 280 60 291 70" stroke-width="1"/>
    <path d="M 267 74 Q 280 64 293 74" stroke-width="1"/>
    <path d="M 268 79 Q 280 70 292 79" stroke-width="1"/>
    <line x1="280" y1="56" x2="280" y2="46" stroke-width="1.8"/>
    <ellipse cx="280" cy="44" rx="6" ry="5" stroke-width="1.5"/>
    <line x1="276" y1="40" x2="280" y2="34" stroke-width="1.2"/>
    <line x1="284" y1="40" x2="280" y2="34" stroke-width="1.2"/>

