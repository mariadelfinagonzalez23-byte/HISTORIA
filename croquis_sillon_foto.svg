    <!-- VISTA LATERAL                           -->
    <!-- ======================================= -->
    <text x="540" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic" stroke="none">— vista lateral —</text>

    <!-- X lateral -->
    <path d="M 490 335 Q 480 385 468 445" stroke-width="3"/>
    <path d="M 505 335 Q 495 385 483 445" stroke-width="2"/>
    <path d="M 490 335 Q 500 385 512 445" stroke-width="3"/>
    <path d="M 505 335 Q 515 385 527 445" stroke-width="2"/>
    <!-- nudo X lateral -->
    <circle cx="497" cy="383" r="8" stroke-width="2"/>
    <circle cx="497" cy="383" r="3" stroke-width="1.5"/>
    <!-- base lateral -->
    <rect x="458" y="443" width="78" height="14" rx="2" stroke-width="2"/>
    <path d="M 460 443 Q 466 436 472 443 Q 478 436 484 443 Q 490 436 496 443 Q 502 436 508 443 Q 514 436 520 443 Q 526 436 532 443 Q 536 436 536 443" stroke-width="1.2"/>

