    <rect x="88" y="88" width="204" height="14" rx="2" stroke-width="1.8"/>
    <path d="M 90 88 Q 96 80 102 88 Q 108 80 114 88 Q 120 80 126 88 Q 132 80 138 88 Q 144 80 150 88 Q 156 80 162 88 Q 168 80 174 88 Q 180 80 186 88 Q 192 80 198 88 Q 204 80 210 88 Q 216 80 222 88 Q 228 80 234 88 Q 240 80 246 88 Q 252 80 258 88 Q 264 80 270 88 Q 276 80 282 88 Q 286 80 290 88" stroke-width="1.5"/>

