<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580">

  <rect width="700" height="580" fill="#FEFDF8"/>

  <text x="350" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#222">SILLÓN SAVONAROLA — Renacimiento italiano (S. XV–XVI)</text>
  <text x="350" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#777" font-style="italic">referencia para copiar a mano · basado en foto original</text>

  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ======================================= -->
    <!-- VISTA FRONTAL                           -->
    <!-- ======================================= -->
    <text x="195" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic" stroke="none">— vista frontal —</text>

    <!-- PATAS EN X IZQUIERDA -->
