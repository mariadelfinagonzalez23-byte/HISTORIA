<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">

  <rect width="680" height="520" fill="#FEFDF8"/>

  <!-- TÍTULO -->
  <text x="340" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#222">ARCÓN GÓTICO — Edad Media (S. XIII–XV)</text>
  <text x="340" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#777" font-style="italic">ejemplo de referencia para copiar a mano</text>

  <g stroke="#1a1a1a" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ======================================= -->
    <!-- VISTA FRONTAL                           -->
    <!-- ======================================= -->
    <text x="185" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic" stroke="none">— vista frontal —</text>

    <!-- TAPA (con arco gótico tallado) -->
    <!-- cuerpo de la tapa -->
    <rect x="60" y="80" width="260" height="55" rx="2" stroke-width="2.2"/>
    <!-- bisagras en tapa (3 herrajes) -->
    <rect x="82"  y="78" width="18" height="12" rx="1" stroke-width="1.5"/>
    <rect x="170" y="78" width="18" height="12" rx="1" stroke-width="1.5"/>
    <rect x="278" y="78" width="18" height="12" rx="1" stroke-width="1.5"/>
    <!-- detalle tapa: moldura perimetral -->
    <rect x="66" y="86" width="248" height="42" rx="1" stroke-width="0.8" stroke="#aaa"/>

    <!-- CUERPO PRINCIPAL -->
    <rect x="60" y="133" width="260" height="195" rx="2" stroke-width="2.2"/>

    <!-- ZÓCALO / BASE con patas bloque -->
    <rect x="55" y="326" width="270" height="22" rx="2" stroke-width="2"/>
    <!-- patas bloque (4) -->
    <rect x="60"  y="346" width="38" height="28" rx="1" stroke-width="2"/>
    <rect x="118" y="346" width="38" height="28" rx="1" stroke-width="2"/>
    <rect x="182" y="346" width="38" height="28" rx="1" stroke-width="2"/>
    <rect x="240" y="346" width="38" height="28" rx="1" stroke-width="2"/>
    <!-- sombra patas -->
    <line x1="64"  y1="350" x2="64"  y2="372" stroke-width="0.7" stroke="#bbb"/>
    <line x1="122" y1="350" x2="122" y2="372" stroke-width="0.7" stroke="#bbb"/>
    <line x1="186" y1="350" x2="186" y2="372" stroke-width="0.7" stroke="#bbb"/>
    <line x1="244" y1="350" x2="244" y2="372" stroke-width="0.7" stroke="#bbb"/>

    <!-- ======================================= -->
    <!-- TRACERÍA GÓTICA EN EL FRENTE (3 arcos) -->
    <!-- ======================================= -->

    <!-- Panel izquierdo: arco apuntado con tracería -->
    <!-- arco exterior -->
    <line x1="72"  y1="315" x2="72"  y2="195" stroke-width="1.8"/>
    <line x1="142" y1="315" x2="142" y2="195" stroke-width="1.8"/>
    <path d="M 72 195 Q 107 148 142 195" stroke-width="1.8"/>
    <!-- arco interior (más pequeño) -->
    <line x1="80"  y1="310" x2="80"  y2="205" stroke-width="1"/>
    <line x1="134" y1="310" x2="134" y2="205" stroke-width="1"/>
    <path d="M 80 205 Q 107 163 134 205" stroke-width="1"/>
    <!-- tracería: óculo (círculo) en la ojiva -->
    <circle cx="107" cy="168" r="12" stroke-width="1.2"/>
    <circle cx="107" cy="168" r="5"  stroke-width="0.8"/>
    <!-- tracería: trefoil (3 lóbulos) -->
    <circle cx="95"  cy="182" r="7" stroke-width="0.9"/>
    <circle cx="119" cy="182" r="7" stroke-width="0.9"/>
    <circle cx="107" cy="178" r="7" stroke-width="0.9"/>
    <!-- líneas verticales panel -->
    <line x1="80"  y1="260" x2="80"  y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="90"  y1="260" x2="90"  y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="100" y1="260" x2="100" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="110" y1="260" x2="110" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="120" y1="260" x2="120" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="130" y1="260" x2="130" y2="310" stroke-width="0.6" stroke="#ccc"/>

    <!-- Panel central: arco apuntado con tracería -->
    <line x1="150" y1="315" x2="150" y2="195" stroke-width="1.8"/>
    <line x1="230" y1="315" x2="230" y2="195" stroke-width="1.8"/>
    <path d="M 150 195 Q 190 145 230 195" stroke-width="1.8"/>
    <line x1="158" y1="310" x2="158" y2="205" stroke-width="1"/>
    <line x1="222" y1="310" x2="222" y2="205" stroke-width="1"/>
    <path d="M 158 205 Q 190 160 222 205" stroke-width="1"/>
    <circle cx="190" cy="165" r="14" stroke-width="1.2"/>
    <circle cx="190" cy="165" r="6"  stroke-width="0.8"/>
    <circle cx="176" cy="180" r="8" stroke-width="0.9"/>
    <circle cx="204" cy="180" r="8" stroke-width="0.9"/>
    <circle cx="190" cy="176" r="8" stroke-width="0.9"/>
    <line x1="158" y1="260" x2="158" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="168" y1="260" x2="168" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="178" y1="260" x2="178" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="190" y1="260" x2="190" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="200" y1="260" x2="200" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="212" y1="260" x2="212" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="222" y1="260" x2="222" y2="310" stroke-width="0.6" stroke="#ccc"/>

    <!-- Panel derecho: arco apuntado -->
    <line x1="238" y1="315" x2="238" y2="195" stroke-width="1.8"/>
    <line x1="308" y1="315" x2="308" y2="195" stroke-width="1.8"/>
    <path d="M 238 195 Q 273 148 308 195" stroke-width="1.8"/>
    <line x1="246" y1="310" x2="246" y2="205" stroke-width="1"/>
    <line x1="300" y1="310" x2="300" y2="205" stroke-width="1"/>
    <path d="M 246 205 Q 273 163 300 205" stroke-width="1"/>
    <circle cx="273" cy="168" r="12" stroke-width="1.2"/>
    <circle cx="273" cy="168" r="5"  stroke-width="0.8"/>
    <circle cx="261" cy="182" r="7" stroke-width="0.9"/>
    <circle cx="285" cy="182" r="7" stroke-width="0.9"/>
    <circle cx="273" cy="178" r="7" stroke-width="0.9"/>
    <line x1="246" y1="260" x2="246" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="256" y1="260" x2="256" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="266" y1="260" x2="266" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="276" y1="260" x2="276" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="286" y1="260" x2="286" y2="310" stroke-width="0.6" stroke="#ccc"/>
    <line x1="296" y1="260" x2="296" y2="310" stroke-width="0.6" stroke="#ccc"/>

    <!-- MOLDURA separando tapa y cuerpo -->
    <line x1="58" y1="133" x2="322" y2="133" stroke-width="2.5"/>
    <line x1="58" y1="140" x2="322" y2="140" stroke-width="0.8" stroke="#aaa"/>

    <!-- HERRAJE CERRADURA (centro tapa) -->
    <rect x="175" y="122" width="30" height="20" rx="3" stroke-width="1.8"/>
    <circle cx="190" cy="132" r="5" stroke-width="1.5"/>
    <line x1="190" y1="127" x2="190" y2="122" stroke-width="1.2"/>

    <!-- ARGOLLAS laterales (para transporte) -->
    <path d="M 64 215 Q 58 205 64 195 Q 70 185 76 195" stroke-width="1.5"/>
    <rect x="63" y="213" width="14" height="6" rx="2" stroke-width="1.2"/>
    <path d="M 304 215 Q 310 205 304 195 Q 298 185 292 195" stroke-width="1.5"/>
    <rect x="303" y="213" width="14" height="6" rx="2" stroke-width="1.2"/>

    <!-- LÍNEA DE SUELO -->
    <line x1="45" y1="375" x2="345" y2="375" stroke-width="0.8" stroke-dasharray="5,4" stroke="#bbb"/>

    <!-- ======================================= -->
    <!-- DETALLE TRACERÍA GÓTICA (ampliado)      -->
    <!-- ======================================= -->
    <text x="510" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic" stroke="none">— detalle tracería —</text>

    <!-- Arco apuntado grande -->
    <line x1="440" y1="310" x2="440" y2="130" stroke-width="2"/>
    <line x1="580" y1="310" x2="580" y2="130" stroke-width="2"/>
    <path d="M 440 130 Q 510 72 580 130" stroke-width="2"/>

    <!-- Tracería interior -->
    <line x1="452" y1="305" x2="452" y2="145" stroke-width="1.2"/>
    <line x1="568" y1="305" x2="568" y2="145" stroke-width="1.2"/>
    <path d="M 452 145 Q 510 92 568 145" stroke-width="1.2"/>

    <!-- Óculo grande -->
    <circle cx="510" cy="108" r="22" stroke-width="1.5"/>
    <circle cx="510" cy="108" r="9"  stroke-width="1"/>
    <!-- pétalos del rosetón -->
    <circle cx="510" cy="87"  r="9" stroke-width="0.9"/>
    <circle cx="510" cy="129" r="9" stroke-width="0.9"/>
    <circle cx="489" cy="108" r="9" stroke-width="0.9"/>
    <circle cx="531" cy="108" r="9" stroke-width="0.9"/>

    <!-- Trefoil debajo del óculo -->
    <circle cx="488" cy="158" r="14" stroke-width="1.2"/>
    <circle cx="532" cy="158" r="14" stroke-width="1.2"/>
    <circle cx="510" cy="145" r="14" stroke-width="1.2"/>

    <!-- líneas verticales panel -->
    <line x1="452" y1="200" x2="452" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="464" y1="200" x2="464" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="476" y1="200" x2="476" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="490" y1="200" x2="490" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="510" y1="200" x2="510" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="530" y1="200" x2="530" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="544" y1="200" x2="544" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="556" y1="200" x2="556" y2="305" stroke-width="0.8" stroke="#bbb"/>
    <line x1="568" y1="200" x2="568" y2="305" stroke-width="0.8" stroke="#bbb"/>

    <!-- Flechas y notas detalle -->
    <line x1="595" y1="108" x2="534" y2="108" stroke-width="0.8" stroke="#888"/>
    <text x="598" y="104" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">óculo</text>
    <text x="598" y="116" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">(rosetón)</text>

    <line x1="595" y1="158" x2="548" y2="158" stroke-width="0.8" stroke="#888"/>
    <text x="598" y="162" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">trefoil</text>
    <text x="598" y="174" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">(3 lóbulos)</text>

    <line x1="595" y1="220" x2="570" y2="220" stroke-width="0.8" stroke="#888"/>
    <text x="598" y="224" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">arco</text>
    <text x="598" y="236" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">apuntado</text>

    <line x1="595" y1="270" x2="570" y2="270" stroke-width="0.8" stroke="#888"/>
    <text x="598" y="274" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">estrías</text>
    <text x="598" y="286" font-family="Georgia, serif" font-size="9" fill="#666" stroke="none">verticales</text>

    <!-- ======================================= -->
    <!-- COTAS                                   -->
    <!-- ======================================= -->
    <!-- Ancho -->
    <line x1="58"  y1="395" x2="322" y2="395" stroke-width="1" stroke="#666"/>
    <line x1="58"  y1="390" x2="58"  y2="400" stroke-width="1" stroke="#666"/>
    <line x1="322" y1="390" x2="322" y2="400" stroke-width="1" stroke="#666"/>
    <text x="190" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555" stroke="none">130 cm</text>

    <!-- Alto total -->
    <line x1="24" y1="80" x2="24" y2="375" stroke-width="1" stroke="#666"/>
    <line x1="19" y1="80"  x2="29" y2="80"  stroke-width="1" stroke="#666"/>
    <line x1="19" y1="375" x2="29" y2="375" stroke-width="1" stroke="#666"/>
    <text x="12" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555" stroke="none" transform="rotate(-90,12,232)">80 cm</text>

    <!-- Alto cuerpo sin tapa -->
    <line x1="38" y1="133" x2="38" y2="326" stroke-width="0.8" stroke="#aaa" stroke-dasharray="3,3"/>
    <line x1="33" y1="133" x2="43" y2="133" stroke-width="0.8" stroke="#aaa"/>
    <line x1="33" y1="326" x2="43" y2="326" stroke-width="0.8" stroke="#aaa"/>
    <text x="26" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#999" stroke="none" transform="rotate(-90,26,232)">58 cm</text>

  </g>

  <!-- NOTAS FINALES -->
  <text x="340" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#aaa" font-style="italic">Características: arco apuntado · tracería gótica (trefoil + óculo) · herrajes de hierro forjado · madera de roble tallada · argollas laterales</text>
  <text x="340" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#aaa" font-style="italic">Función: guardar vestimentas, documentos y objetos de valor · símbolo de riqueza y estatus · también usado como asiento y cama</text>
  <text x="340" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#aaa" font-style="italic">Movimiento: Gótico · Edad Media S. XIII–XV · influencia de la arquitectura catedralicia</text>

  <text x="670" y="496" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#ccc" font-style="italic">referencia para dibujo a mano · M.D.G. 2025</text>

</svg>
